<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlipFin — Solana Trading Terminal</title>
    <meta name="description" content="Professional-grade Solana trading terminal. Catch new flips, monitor bonding curves, and track graduation metrics in real-time." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'solana-purple': '#9945FF',
                        'solana-green': '#14F195',
                        'dark-bg': '#0F0F17',
                        'card-bg': '#1A1A2E',
                        'accent-yellow': '#FBBF24',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        heading: ['Orbitron', 'monospace'],
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }

        h1,
        h2,
        h3 {
            font-family: 'Orbitron', monospace;
        }

        .scroll-smooth {
            scroll-behavior: smooth;
        }

        .logo-img {
            filter: drop-shadow(0 4px 6px rgba(20, 241, 149, 0.4));
            transition: transform 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.05);
        }
    </style>
  </head>
  <body class="bg-gray-900 text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
